{% extends "base.html" %}

{% block title %}Admin Login – KÖNIGSWETTE{% endblock %}

{% block content %}

<h2>🔐 Admin-Login</h2>

<form method="POST">
    <label for="pin">Admin-PIN:</label>
    <input
        type="password"
        id="pin"
        name="pin"
        inputmode="numeric"
        required
        autofocus
    >

    <button type="submit">Einloggen</button>
</form>

<p>
    <a href="{{ url_for('index') }}">← Zurück zur KÖNIGSWETTE</a>
</p>

{% endblock %}
